<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صلِّ على النبي ﷺ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "Traditional Arabic", "Amiri", "Segoe UI", Tahoma, serif;
    background: radial-gradient(circle at 50% 0%, #0f3d2e 0%, #08251c 55%, #05160f 100%);
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  /* decorative border frame */
  .frame {
    position: fixed;
    inset: 14px;
    border: 2px solid rgba(212, 175, 55, 0.55);
    border-radius: 18px;
    pointer-events: none;
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 46px;
    height: 46px;
    border: 2px solid rgba(212, 175, 55, 0.75);
    border-radius: 50%;
  }
  .frame::before { top: -24px; left: -24px; }
  .frame::after { bottom: -24px; right: -24px; }

  /* soft glowing dots (stars) */
  .star {
    position: fixed;
    background: rgba(255, 246, 210, 0.85);
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.4); }
  }

  .content {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 40px 30px;
  }

  .ornament-top {
    font-size: 30px;
    color: #d4af37;
    margin-bottom: 18px;
    opacity: 0.9;
    letter-spacing: 10px;
  }

  h1 {
    font-size: clamp(38px, 9vw, 64px);
    color: #f4e5b2;
    text-shadow: 0 0 18px rgba(212, 175, 55, 0.55), 0 0 40px rgba(212, 175, 55, 0.25);
    line-height: 1.5;
    animation: glow 3.5s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 18px rgba(212, 175, 55, 0.45), 0 0 40px rgba(212, 175, 55, 0.2); }
    50% { text-shadow: 0 0 28px rgba(212, 175, 55, 0.8), 0 0 60px rgba(212, 175, 55, 0.45); }
  }

  .salawat {
    font-size: clamp(20px, 4.5vw, 30px);
    color: #9fd8b8;
    margin-top: 20px;
    line-height: 2;
  }

  .ornament-bottom {
    margin-top: 34px;
    font-size: 22px;
    color: #d4af37;
    opacity: 0.85;
  }

  .divider {
    width: 140px;
    height: 2px;
    margin: 26px auto;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="content">
    <div class="ornament-top">۞ ۞ ۞</div>
    <h1>صلِّ على النبي ﷺ</h1>
    <div class="divider"></div>
    <p class="salawat">
      اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى<br>
      سَيِّدِنَا مُحَمَّدٍ ﷺ
    </p>
    <div class="ornament-bottom">۩</div>
  </div>

<script>
  // generate soft twinkling stars
  const count = 45;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.animationDuration = (2 + Math.random() * 4) + 's';
    star.style.animationDelay = (Math.random() * 3) + 's';
    document.body.appendChild(star);
  }
</script>
</body>
</html>
